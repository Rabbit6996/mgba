name: Build 3DS

on:
  push:
  workflow_dispatch:

jobs:
  build-3ds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the mgba/3ds toolchain image
        run: |
          # The image builds as its own user, so let it write to the checkout
          chmod -R a+rwX .
          docker run --rm -t -e MAKEFLAGS=-j4 -v "$PWD:/home/mgba/src" mgba/3ds

      - name: Collect binaries
        run: |
          mkdir -p out
          find . -path ./out -prune -o \( -name '*.3dsx' -o -name '*.cia' \) -print -exec cp {} out/ \;
          ls -l out

      - name: Check the Wi-Fi link is built in
        run: |
          echo "::warning::outputs: $(ls out | tr '\n' ' ')"
          echo "::warning::build dirs: $(ls -d build* 2>/dev/null | tr '\n' ' ')"
          echo "::warning::cache: $(grep -rh -E '^(ENABLE_NETLINK|CMAKE_TOOLCHAIN_FILE|3DS)[:=]' --include=CMakeCache.txt . | tr '\n' ' ')"
          echo "::warning::flags.h: $(grep -rh -A1 'ifndef ENABLE_NETLINK' --include=flags.h . | tr '\n' ' ')"
          echo "::warning::elf: $(find . -name '*.elf' | tr '\n' ' ')"
          for f in $(find . -name '*.elf') out/*.3dsx; do
            echo "::warning::$f menu=$(grep -a -c 'Link cable (Wi-Fi)' "$f") pause=$(grep -a -c 'Game Paused' "$f")"
          done
          grep -a -q 'Link cable (Wi-Fi)' out/*.3dsx

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mgba-3ds
          path: out/
          if-no-files-found: error
